[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thvrpd"
version = "0.1.0"
description = "Paper-faithful exact algorithms for the Truck-as-Hub VRP with Drones"
requires-python = ">=3.10"
dependencies = [
  "gurobipy",
  "numpy",
  "networkx",
  "matplotlib",
  "scikit-learn",
  "sortedcontainers",
  "colorama",
  "pytest",
  "psutil",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
